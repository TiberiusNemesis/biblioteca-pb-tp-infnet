name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  service-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [catalog-service, loan-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -f ${{ matrix.module }}/pom.xml --batch-mode test

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  deployment-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: docker compose config --quiet
      - run: kubectl kustomize k8s >/dev/null
      - run: |
          docker build -t biblioteca/catalog:test catalog-service
          docker build -t biblioteca/loan:test loan-service
          docker build -t biblioteca/frontend:test frontend
