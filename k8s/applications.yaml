apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog-service}
  template:
    metadata:
      labels: {app: catalog-service}
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: [sh, -c, "until nc -z catalog-postgres 5432 && nc -z rabbitmq 5672; do sleep 2; done"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
      containers:
        - name: catalog-service
          image: biblioteca/catalog:local
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: application-config}}]
          env:
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: biblioteca-secrets, key: catalog-db-username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: biblioteca-secrets, key: catalog-db-password}}
            - name: RABBITMQ_USERNAME
              valueFrom: {secretKeyRef: {name: biblioteca-secrets, key: rabbitmq-username}}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: biblioteca-secrets, key: rabbitmq-password}}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: &catalog-probe
            httpGet: {path: /actuator/health/liveness, port: http}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe: *catalog-probe
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata: {name: catalog-service}
spec:
  selector: {app: catalog-service}
  ports: [{name: http, port: 8080, targetPort: http}]
---
