apiVersion: v1
kind: Secret
metadata:
  name: biblioteca-secrets
  annotations:
    purpose: local-development-only
type: Opaque
stringData:
  catalog-db-username: biblioteca
  catalog-db-password: biblioteca
  loan-db-username: loans
  loan-db-password: loans
  rabbitmq-username: biblioteca
  rabbitmq-password: biblioteca
  grafana-admin-user: admin
  grafana-admin-password: admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: application-config
data:
  DB_URL: jdbc:postgresql://catalog-postgres:5432/biblioteca
  LOAN_DB_URL: jdbc:postgresql://loan-postgres:5432/loans
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  TRACING_SAMPLING_PROBABILITY: "1.0"
