spring:
  application:
    name: loan-service

  datasource:
    url: ${LOAN_DB_URL:jdbc:postgresql://localhost:5433/loans}
    driver-class-name: org.postgresql.Driver
    username: ${LOAN_DB_USERNAME:loans}
    password: ${LOAN_DB_PASSWORD:loans}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  port: 8081

catalog:
  base-url: ${CATALOG_URL:http://localhost:8080}
