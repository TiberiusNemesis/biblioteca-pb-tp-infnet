spring:
  application:
    name: biblioteca

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5431/biblioteca}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:biblioteca}
    password: ${DB_PASSWORD:biblioteca}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:biblioteca}
    password: ${RABBITMQ_PASSWORD:biblioteca}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

server:
  port: 8080

library:
  messaging:
    exchange: library.events
    outbox:
      enabled: ${OUTBOX_ENABLED:true}
      fixed-delay: ${OUTBOX_FIXED_DELAY:1000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT:5s}
