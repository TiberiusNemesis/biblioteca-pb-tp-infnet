spring:
  application:
    name: loan-service

  datasource:
    url: ${LOAN_DB_URL:jdbc:postgresql://localhost:5433/loans}
    driver-class-name: org.postgresql.Driver
    username: ${LOAN_DB_USERNAME:loans}
    password: ${LOAN_DB_PASSWORD:loans}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:biblioteca}
    password: ${RABBITMQ_PASSWORD:biblioteca}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: false
      observation-enabled: true
    listener:
      observation-enabled: true
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  structured:
    format:
      console: logstash

library:
  messaging:
    exchange: library.events
    catalog-events-queue: library.loan-service.catalog-events.v1
    dead-letter-exchange: library.loan-service.dlx
    dead-letter-queue: library.loan-service.catalog-events.dlq
    outbox:
      enabled: ${OUTBOX_ENABLED:true}
      fixed-delay: ${OUTBOX_FIXED_DELAY:1000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT:5s}
