spring:
  datasource:
    url: jdbc:h2:mem:loans-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

library:
  messaging:
    exchange: library.events
    catalog-events-queue: library.loan-service.catalog-events.v1
    dead-letter-exchange: library.loan-service.dlx
    dead-letter-queue: library.loan-service.catalog-events.dlq
    outbox:
      enabled: false
      confirm-timeout: 1s
