apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: catalog-service}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: catalog-service}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: loan-service}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: loan-service}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
